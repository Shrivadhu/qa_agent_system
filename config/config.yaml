# QA Agent Configuration

# Database Configuration
database:
  host: localhost
  port: 5432
  name: qa_agent_db
  user: qa_agent_user
  password: ${DB_PASSWORD}
  pool_size: 10
  max_overflow: 20

# NLP Models
models:
  # Pre-trained models
  bert_base: "bert-base-uncased"
  sentiment_model: "distilbert-base-uncased-finetuned-sst-2-english"
  sentence_transformer: "all-MiniLM-L6-v2"
  
  # Custom model paths (optional)
  teaching_quality_classifier: "models/teaching_quality_bert.pt"
  
  # Model parameters
  max_sequence_length: 512
  batch_size: 32

# Keyword Extraction
keyword_extraction:
  # TF-IDF parameters
  tfidf:
    max_features: 100
    ngram_range: [1, 3]
    min_df: 2
  
  # YAKE parameters
  yake:
    lan: "en"
    n: 3
    dedupLim: 0.9
    dedupFunc: "seqm"
    windowsSize: 1
    top: 100

# Teaching Quality Dimensions
teaching_quality:
  dimensions:
    - clarity
    - engagement
    - patience
    - structure
    - relevance
  weights:
    clarity: 0.25
    engagement: 0.20
    patience: 0.15
    structure: 0.20
    relevance: 0.20

# Feedback Validation
feedback_validation:
  # Plagiarism detection
  plagiarism_threshold: 0.90
  
  # Template matching
  template_threshold: 0.85
  
  # Human-likeness parameters
  human_likeness:
    min_sentence_length_variance: 0.15
    expected_typo_rate: 0.02
    min_specific_details: 2

# QA Verdict Thresholds
verdict:
  thresholds:
    successful: 0.90
    partial: 0.70
    dispute: 0.50
  
  component_weights:
    scope_completeness: 0.167
    teaching_quality: 0.167
    learning_indicators: 0.167
    feedback_authenticity: 0.167
    participant_satisfaction: 0.166
    compliance: 0.166

# Logging
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"  # loguru syntax
  file: "logs/qa_agent.log"
  rotation: "10 MB"
  retention: "30 days"

# Cache
cache:
  enabled: true
  backend: "redis"
  host: "localhost"
  port: 6379
  ttl: 3600  # seconds

# API
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout: 300
